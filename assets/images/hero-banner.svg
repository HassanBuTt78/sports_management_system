<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062a63"/>
      <stop offset="55%" stop-color="#0B5ED7"/>
      <stop offset="100%" stop-color="#0f7a4f"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="10%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#heroGrad)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <!-- field lines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" fill="none">
    <circle cx="800" cy="620" r="140"/>
    <line x1="0" y1="620" x2="1600" y2="620"/>
    <rect x="60" y="470" width="260" height="300"/>
    <rect x="1280" y="470" width="260" height="300"/>
  </g>
  <!-- floodlights -->
  <g fill="#FFC107" opacity="0.85">
    <circle cx="140" cy="120" r="6"/>
    <circle cx="170" cy="100" r="6"/>
    <circle cx="200" cy="130" r="6"/>
    <circle cx="1400" cy="150" r="6"/>
    <circle cx="1430" cy="120" r="6"/>
    <circle cx="1460" cy="145" r="6"/>
  </g>
</svg>
